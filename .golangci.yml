version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - godot
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  # This is an upstream driver source mirror, checked separately by its
  # provenance manifest. Project style linters do not apply to its generated
  # FFI patterns or preserved upstream formatting.
  exclusions:
    paths:
      - internal/sqlitenofollow/

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
