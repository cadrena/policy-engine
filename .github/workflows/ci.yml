name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and public boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test with race detector
        run: make race

      - name: Vet
        run: make vet

      - name: Check generated files
        run: make generated-check

      - name: Scan vulnerabilities
        run: make vuln-check

      - name: Enforce public boundary
        run: make boundary
